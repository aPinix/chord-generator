name: Report a bug
description: Something in G-Chord doesn't work the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more we know about what you did and what you saw, the faster it gets fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: Tell us what you saw. If there was an error message, copy it here.
      placeholder: When I tap Strum, no sound plays.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we see it too?
      description: The steps that lead to the problem, one per line.
      placeholder: |
        1. Search for Am7
        2. Open Zen mode
        3. Sweep the pick across the strings
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The chord should ring out with the nylon guitar sound.
    validations:
      required: true

  - type: input
    id: chord
    attributes:
      label: Which chord, if it matters?
      description: The chord name, or the frets from low E to high E.
      placeholder: Fmaj7, or X X 3 2 1 0

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iPhone
        - iPad
        - Android phone or tablet
        - Mac
        - Windows PC
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Safari
        - Chrome
        - Firefox
        - Edge
        - Arc
        - Brave
        - Other
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording
      description: Drag images or videos into this box. Optional, but they help a lot.
